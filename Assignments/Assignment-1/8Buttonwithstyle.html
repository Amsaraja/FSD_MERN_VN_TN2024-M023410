<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button With Style</title>
    <style>
        button{
             background-color: blue;
             color: white;
             padding:10px;
             margin:10px;
             border-radius: 7px;
            border-color: transparent;
            
        }
        button:hover{
            background-color: rgb(57, 57, 204);
            cursor: pointer;
        }
    </style>
</head>
<body>
    <button>Click Me</button>
</body>
</html>
