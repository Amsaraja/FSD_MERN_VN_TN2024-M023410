<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Methods Of Style Using In Webpage</title>
    <link rel="stylesheet" href="11Style-method.css">
    <style>
        .second h1{
            color:blue;
            text-align: center;
        }
        .second p{
            font-size: 20px;
            font-family: 'Times New Roman', serif;
            color: purple;
            text-align: center;
        }
    </style>
</head>

<body>
    <section class="first">
    <h1 style="color: blue; text-align: center;">This is a Heading</h1>
    <p style="font-size: 20px; font-family: 'Times New Roman', Times, serif; color:purple; text-align: center;">
        This is a paragraph demonstrating inline CSS styling.
    </p>
    </section>
    <section class="second">
    <h1>This is a second heading</h1>
    <p>This is another paragraph without inline styling.</p>
    </section>
    <section class="third">
        <h1>This is a third heading</h1>
        <p>This is the another paragraph for external Styling</p>
    </section>
</body>
</html>
