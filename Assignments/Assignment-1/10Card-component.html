<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Component</title>
    <link rel="stylesheet" href="10Card-component.css">
    <style>
        body {
            background-color: rgb(247, 247, 139);
            font-family: 'Times New Roman', Times, serif;
        }

        div {
            width: 340px;
            box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2);
            border-radius: 5px;
            background-color: white;
            margin: 20px;
            padding: 10px;
        }

        img {
            width: 300px;
            height: 400px;
            margin-top: 20px;
            margin-left: 20px;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <div>
        <img src="/Week-1-Assignment/chocolate-cake.jpg" alt="Chocolate Cake">
        <h4 style="color: brown;  margin-left: 20px; margin-top: 20px; font-size: 30px;">Chocolate Cake</h4>
        <p style="margin-left: 20px; margin-top: 5px;">This is the chocolate Cake </p>
    </div>
</body>

</html>
