<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box Model</title>
    <style>
        .div1, .div2 ,.div3{
            background-color: aquamarine;
            width:500px;
          
            margin:20px;
            padding:20px;
            border: 2px solid  gray ;
            border-radius:5px;
            margin-right:20px;
            margin-left: 400px;
        }
    </style>

</head>
<body>
    <div class="div1">
       <p>This is Div1 Box Model</p>  

    </div>
    <div class="div2">
        <p> This is Div2 Box Model</p>
        
    </div>
    <div class="div3">
        <p>This is Div3 Box Model</p>
    </div>
    
</body>
</html>
