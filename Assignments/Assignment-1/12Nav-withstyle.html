<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nav With Style</title>
    <style>
         body {
            background-color: gray;
            font-family: 'Times New Roman', Times, serif;
        }

        .navbar {
            display: flex;
            background-color: aquamarine;


        }

        .nav-list {
            list-style-type: none;
            display: flex;
            gap: 30px;
            margin-top: 10px;
            margin-left: auto;
            padding-right: 80px;
            padding-top: 10px;

        }

        .nav-list li a {
            text-decoration: none;
            color: black;
            font-weight: bold;
            font-size: 20px;
        }

        .nav-list li a:hover {
            text-decoration: underline;
        }

        .logo {
            margin-top: 0px;
            padding-left: 30px;
            padding-top: 10px;
        }

       

      
    </style>
    
</head>
<body>
     <header>
        <nav class="navbar">
            <div>
                <h1 class="logo">My Website</h1>
            </div>
            <ul class="nav-list">
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#service">Service</a></li>
                <li><a href="#portfolio">Portfolio</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>
</body>
</html>
